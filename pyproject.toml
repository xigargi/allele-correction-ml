[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "allele_correction_ml"
version = "0.0.1"
description = "ML pipeline to detect and correct erroneous allele values from DNA sequencer output for canine identification."
authors = [
  { name = "xigargi" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["allele_correction_ml"]
include = ["pyproject.toml", "allele_correction_ml/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["allele_correction_ml"]
force-sort-within-sections = true

